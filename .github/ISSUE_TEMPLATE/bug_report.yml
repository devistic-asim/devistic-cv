name: Bug
description: Something in Devistic CV does not work as described.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open the editor
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 134 on macOS
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot or the exported JSON helps. Do not include private contact details you do not want in a public issue.
